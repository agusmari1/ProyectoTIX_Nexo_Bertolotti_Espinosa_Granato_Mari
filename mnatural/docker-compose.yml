services:
  db:
    image: postgres:17
    container_name: mnatural-db
    environment:
      POSTGRES_DB: mNatural
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: contrasenanexo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Servidor de correo de PRUEBA: recibe todos los mails de la app y los muestra en una web, sin mandar nada a internet.
  # SMTP en el puerto 1025 y la bandeja en http://localhost:8025
  mailpit:
    image: axllent/mailpit
    container_name: mnatural-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata: