<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solicitud enviada | Uruguay Mnatural</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 640px;">

    <div class="card text-center">
        <div class="card-body p-5">
            <h1 class="h3 mb-3">¡Solicitud enviada!</h1>
            <p class="mb-2">
                Tu registro como prestador quedó <strong>pendiente de aprobación</strong>.
            </p>
            <p class="text-muted mb-4">
                Un administrador va a revisar tus datos. Te vamos a avisar por correo electrónico
                cuando tu solicitud sea aprobada o rechazada. Hasta entonces no vas a poder
                ingresar a la plataforma.
            </p>
            <a th:href="@{/}" class="btn btn-outline-secondary">Volver al inicio</a>
        </div>
    </div>

</main>
</body>
</html>
