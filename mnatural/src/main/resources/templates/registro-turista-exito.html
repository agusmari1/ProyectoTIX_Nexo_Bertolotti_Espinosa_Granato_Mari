<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{regTouristDone.title} + ' | ' + #{common.brand}">Cuenta creada | Uruguay Mnatural</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<!-- La foto se define en styles.css (.hero-exito) -->
<section class="hero hero-small hero-photo hero-exito">
    <div class="container">
        <h1 th:text="#{regTouristDone.heading}">¡Te damos la bienvenida!</h1>
        <p th:text="#{regTouristDone.subtitle}">Tu próxima aventura en la naturaleza está a un paso.</p>
    </div>
</section>

<main class="page container page-medium">

    <div class="card card-feature">
        <div class="card-body">
            <div class="feature-icon">✓</div>
            <h2 class="h3 mb-3" th:text="#{regTouristDone.created}">¡Cuenta creada!</h2>
            <p class="text-muted mb-4" th:text="#{regTouristDone.text}">
                Tu registro como turista se completó. Ya podés iniciar sesión
                y empezar a reservar actividades.
            </p>
            <div class="d-flex flex-wrap justify-content-center gap-2">
                <a th:href="@{/login}" class="btn btn-success" th:text="#{login.title}">Iniciar sesión</a>
                <a th:href="@{/}" class="btn btn-outline-secondary" th:text="#{regTouristDone.backHome}">Volver al inicio</a>
            </div>
        </div>
    </div>

</main>

<footer class="site-footer">
    <div class="container">
        <a th:href="@{/}" class="brand"><span class="brand-mark"></span><span th:text="#{common.brand}">Uruguay Mnatural</span></a>
        <span th:text="#{footer.tagline}">Experiencias de naturaleza en todo Uruguay</span>
    </div>
</footer>

</body>
</html>
