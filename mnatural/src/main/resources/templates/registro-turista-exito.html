<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cuenta creada | Uruguay Mnatural</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 640px;">

    <div class="card text-center">
        <div class="card-body p-5">
            <h1 class="h3 mb-3">¡Cuenta creada!</h1>
            <p class="text-muted mb-4">
                Tu registro como turista se completó. Ya podés iniciar sesión
                y empezar a reservar actividades.
            </p>
            <a th:href="@{/login}" class="btn btn-success">Iniciar sesión</a>
            <a th:href="@{/}" class="btn btn-outline-secondary">Volver al inicio</a>
        </div>
    </div>

</main>
</body>
</html>
