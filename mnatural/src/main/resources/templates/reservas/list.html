<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{myBookings.title} + ' | ' + #{common.brand}">Mis reservas | Uruguay Mnatural</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<!-- La foto se define en styles.css (.hero-actividades) -->
<section class="hero hero-compact hero-photo hero-actividades">
    <div class="container">
        <h1 th:text="#{myBookings.title}">Mis reservas</h1>
        <p th:text="#{myBookings.subtitle}">Tus próximas actividades y las que ya hiciste, para que las valores.</p>
    </div>
</section>

<main class="page page-flat container page-wide">

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="alert alert-info" th:if="${#lists.isEmpty(bookings)}">
        <span th:text="#{myBookings.empty}">Todavía no tenés reservas.</span>
        <a th:href="@{/actividades}" th:text="#{myBookings.seeActivities}">Mirá las actividades disponibles</a>.
    </div>

    <!-- Próximas: la actividad todavía no empezó -->
    <section id="upcoming-bookings" th:unless="${#lists.isEmpty(upcoming)}">
        <h2 class="h4 mb-3" th:text="#{myBookings.upcoming}">Próximas</h2>
        <th:block th:each="booking : ${upcoming}">
            <th:block th:replace="~{fragments/tourist-booking :: card(${booking})}"></th:block>
        </th:block>
    </section>

    <!-- Pasadas: ya empezaron o ya pasaron. Si están confirmadas y terminaron, se pueden valorar -->
    <section id="past-bookings" th:unless="${#lists.isEmpty(past)}">
        <h2 class="h4 mb-3 mt-4" th:text="#{myBookings.past}">Pasadas</h2>
        <th:block th:each="booking : ${past}">
            <th:block th:replace="~{fragments/tourist-booking :: card(${booking})}"></th:block>
        </th:block>
    </section>

</main>

<footer class="site-footer">
    <div class="container">
        <a th:href="@{/}" class="brand"><span class="brand-mark"></span><span th:text="#{common.brand}">Uruguay Mnatural</span></a>
        <span th:text="#{footer.tagline}">Experiencias de naturaleza en todo Uruguay</span>
    </div>
</footer>

</body>
</html>
