<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{home.title}">Uruguay Mnatural</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<!-- La foto se define en styles.css (.hero-inicio) -->
<section class="hero hero-photo hero-inicio">
    <div class="container">
        <h1 th:text="#{home.title}">Uruguay Mnatural</h1>
        <p th:text="#{home.subtitle}">Descubrí y reservá actividades turísticas en todo el país.</p>
    </div>
</section>

<main class="page container page-medium">

    <div class="card card-feature">
        <div class="card-body">
            <!-- Visitante: los dos registros y el link para iniciar sesión -->
            <th:block th:if="${loggedInAs == null}">
                <div class="d-grid gap-3">
                    <a th:href="@{/registro/turista}" class="btn btn-outline-success btn-lg" th:text="#{home.registerTourist}">
                        Registrarme como turista
                    </a>

                    <a th:href="@{/registro/prestador}" class="btn btn-success btn-lg" th:text="#{home.registerProvider}">
                        Registrarme como prestador
                    </a>
                </div>

                <p class="text-muted mt-4 mb-0">
                    <span th:text="#{home.haveAccount}">¿Ya tenés cuenta?</span>
                    <a th:href="@{/login}" th:text="#{home.loginLink}">Iniciá sesión</a>
                </p>
            </th:block>

            <!-- Con la sesión iniciada: ya no tiene sentido registrarse ni volver a iniciar sesión -->
            <th:block th:if="${loggedInAs != null}">
                <p class="text-muted mb-4">
                    <span th:text="#{home.loggedInAs}">Iniciaste sesión como</span> <strong th:text="${loggedInAs}"></strong>.
                </p>

                <div class="d-grid gap-3">
                    <a th:if="${panelUrl != null}" th:href="@{${panelUrl}}" class="btn btn-success btn-lg" th:text="#{home.goToPanel}">
                        Ir a mi panel
                    </a>

                    <a th:if="${tourist}" th:href="@{/turista/reservas}" class="btn btn-success btn-lg" th:text="#{nav.myBookings}">
                        Mis reservas
                    </a>

                    <a th:href="@{/actividades}" class="btn btn-outline-success btn-lg" th:text="#{nav.viewActivities}">
                        Ver actividades
                    </a>
                </div>
            </th:block>
        </div>
    </div>

</main>

<footer class="site-footer">
    <div class="container">
        <a th:href="@{/}" class="brand"><span class="brand-mark"></span><span th:text="#{common.brand}">Uruguay Mnatural</span></a>
        <span th:text="#{footer.tagline}">Experiencias de naturaleza en todo Uruguay</span>
    </div>
</footer>

</body>
</html>
