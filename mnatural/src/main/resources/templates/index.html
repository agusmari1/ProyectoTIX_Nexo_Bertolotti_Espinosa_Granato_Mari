<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Uruguay Mnatural</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header class="site-header">
    <div class="container">
        <a th:href="@{/}" class="brand"><span class="brand-mark"></span>Uruguay Mnatural</a>
        <nav class="site-nav">
            <a th:href="@{/login}" class="nav-cta">Iniciar sesión</a>
        </nav>
    </div>
</header>

<!-- La foto se define en styles.css (.hero-inicio) -->
<section class="hero hero-photo hero-inicio">
    <div class="container">
        <h1>Uruguay Mnatural</h1>
        <p>Descubrí y reservá actividades turísticas en todo el país.</p>
    </div>
</section>

<main class="page container page-medium">

    <div class="card card-feature">
        <div class="card-body">
            <div class="d-grid gap-3">
                <a th:href="@{/registro/turista}" class="btn btn-outline-success btn-lg">
                    Registrarme como turista
                </a>

                <a th:href="@{/registro/prestador}" class="btn btn-success btn-lg">
                    Registrarme como prestador
                </a>
            </div>

            <p class="text-muted mt-4 mb-0">
                ¿Ya tenés cuenta? <a th:href="@{/login}">Iniciá sesión</a>
            </p>
        </div>
    </div>

</main>

<footer class="site-footer">
    <div class="container">
        <a th:href="@{/}" class="brand"><span class="brand-mark"></span>Uruguay Mnatural</a>
        <span>Experiencias de naturaleza en todo Uruguay</span>
    </div>
</footer>

</body>
</html>
