<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Uruguay Mnatural</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 640px;">

    <div class="card text-center">
        <div class="card-body p-5">
            <h1 class="mb-3">Uruguay Mnatural</h1>
            <p class="text-muted mb-4">
                Descubrí y reservá actividades turísticas en todo el país.
            </p>

            <div class="d-grid gap-3">
                <a th:href="@{/registro/turista}" class="btn btn-outline-success btn-lg">
                    Registrarme como turista
                </a>

                <a th:href="@{/registro/prestador}" class="btn btn-success btn-lg">
                    Registrarme como prestador
                </a>
            </div>

            <p class="mt-4 mb-0">
                ¿Ya tenés cuenta? <a th:href="@{/login}">Iniciá sesión</a>
            </p>
        </div>
    </div>

</main>
</body>
</html>
