<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reseñas | Uruguay Mnatural</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<section class="hero hero-compact hero-photo hero-actividades">
    <div class="container">
        <h1>Reseñas</h1>
        <p>Lo que opinan los turistas de tus actividades. Podés responder públicamente, pero no eliminar reseñas.</p>
    </div>
</section>

<main class="page page-flat container page-wide-xl">

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="alert alert-info" th:if="${#lists.isEmpty(reviews)}">
        Todavía no hay reseñas de tus actividades.
    </div>

    <div class="card item-card mb-4" th:each="review : ${reviews}">
        <div class="card-header">
            <span th:text="${review.activityName()}">Actividad</span>
            <span class="badge text-bg-light border" th:text="${review.stars()}">★★★★★</span>
        </div>
        <div class="card-body">
            <p class="small text-muted mb-2"
               th:text="${review.authorName()} + ' · ' + ${#temporals.format(review.createdAt(), 'dd/MM/yyyy')}">Ana P. · 01/01/2027</p>
            <p style="white-space: pre-line" th:if="${review.comment() != null}" th:text="${review.comment()}"></p>
            <p class="text-muted fst-italic" th:if="${review.comment() == null}">Sin comentario.</p>

            <!-- Ya respondida: se muestra la respuesta (no se puede cambiar ni quitar) -->
            <div class="alert alert-light border small mb-0" th:if="${review.replied()}">
                <strong>Tu respuesta</strong>
                (<span th:text="${#temporals.format(review.providerRepliedAt(), 'dd/MM/yyyy HH:mm')}">fecha</span>):
                <span style="white-space: pre-line" th:text="${review.providerReply()}"></span>
            </div>

            <!-- Sin responder: formulario -->
            <form th:unless="${review.replied()}" th:action="@{/provider/reviews/{id}/reply(id=${review.id()})}" method="post">
                <label th:for="|reply-${review.id()}|" class="form-label small">Responder públicamente</label>
                <textarea th:id="|reply-${review.id()}|" name="reply" rows="2" maxlength="1000" class="form-control mb-2"
                          placeholder="Escribí tu respuesta"></textarea>
                <button type="submit" class="btn btn-outline-success btn-sm">Responder</button>
            </form>
        </div>
    </div>

</main>

<footer class="site-footer">
    <div class="container">
        <a th:href="@{/}" class="brand"><span class="brand-mark"></span>Uruguay Mnatural</a>
        <span>Experiencias de naturaleza en todo Uruguay</span>
    </div>
</footer>

</body>
</html>
