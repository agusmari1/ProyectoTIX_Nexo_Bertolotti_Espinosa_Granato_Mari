<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fechas y horarios | Uruguay Mnatural</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header class="site-header">
    <div class="container">
        <a th:href="@{/}" class="brand"><span class="brand-mark"></span>Uruguay Mnatural</a>
    </div>
</header>

<!-- La foto se define en styles.css (.hero-actividades) -->
<section class="hero hero-compact hero-photo hero-actividades">
    <div class="container">
        <h1>Fechas y horarios</h1>
        <p th:text="${activity.name}"></p>
    </div>
</section>

<main class="page page-flat container page-wide">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
        <a th:href="@{/provider/activities}" class="back-link">&larr; Mis actividades</a>
        <a th:href="@{/provider/activities/{id}/reviews(id=${activity.id})}" class="btn btn-outline-success btn-sm">Ver reseñas</a>
    </div>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <!-- Nuevo horario -->
    <div class="card mb-4">
        <div class="card-header">Agregar horario</div>
        <div class="card-body">
            <form th:action="@{/provider/activities/{id}/schedules(id=${activity.id})}" th:object="${schedule}"
                  method="post" class="row g-3" novalidate>

                <div class="col-md-6">
                    <label for="startDateTime" class="form-label">Fecha y hora de inicio</label>
                    <input type="datetime-local" id="startDateTime" class="form-control" th:field="*{startDateTime}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{startDateTime}"></div>
                </div>

                <div class="col-md-6">
                    <label for="capacity" class="form-label">Cupos</label>
                    <input type="number" min="1" id="capacity" class="form-control" th:field="*{capacity}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{capacity}"></div>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-success">Agregar horario</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Horarios cargados -->
    <div class="card">
        <div class="card-header">Horarios cargados</div>
        <div class="card-body" th:if="${#lists.isEmpty(schedules)}">
            <p class="text-muted mb-0">Todavía no agregaste horarios.</p>
        </div>
        <div class="table-responsive" th:unless="${#lists.isEmpty(schedules)}">
            <table class="table mb-0">
                <thead>
                <tr>
                    <th>Fecha y hora</th>
                    <th>Capacidad</th>
                    <th>Lugares libres</th>
                    <th>Estado</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${schedules}">
                    <td th:text="${#temporals.format(item.schedule.startDateTime, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${item.schedule.capacity}"></td>
                    <!-- Calculado con BookingService.availableSpots: confirmadas y pendientes con retención vigente -->
                    <td>
                        <span th:text="${item.availableSpots}"></span>
                        <span class="badge text-bg-secondary ms-1" th:if="${item.availableSpots == 0}">Completo</span>
                    </td>
                    <td th:text="${item.schedule.status.name() == 'SCHEDULED'} ? 'Programado'
                                 : (${item.schedule.status.name() == 'SUSPENDED'} ? 'Suspendido' : 'Finalizado')"></td>
                    <td class="text-end">
                        <!-- Cancela todas las reservas del horario y reembolsa el 100 % -->
                        <form th:if="${item.schedule.status.name() == 'SCHEDULED'}"
                              th:action="@{/provider/activities/{id}/schedules/{scheduleId}/suspend(id=${activity.id}, scheduleId=${item.schedule.id})}"
                              method="post"
                              onsubmit="return confirm('¿Suspender este horario? Se cancelan todas sus reservas y se reembolsa el 100 % de lo pagado.');">
                            <button type="submit" class="btn btn-outline-danger btn-sm">Suspender</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<footer class="site-footer">
    <div class="container">
        <a th:href="@{/}" class="brand"><span class="brand-mark"></span>Uruguay Mnatural</a>
        <span>Experiencias de naturaleza en todo Uruguay</span>
    </div>
</footer>

</body>
</html>
