<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fechas y horarios | Uruguay Mnatural</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 760px;">

    <a th:href="@{/provider/activities}" class="small">&larr; Mis actividades</a>
    <h1 class="mt-2 mb-1">Fechas y horarios</h1>
    <p class="text-muted mb-4" th:text="${activity.name}"></p>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <!-- Nuevo horario -->
    <div class="card mb-4">
        <div class="card-header fw-semibold">Agregar horario</div>
        <div class="card-body">
            <form th:action="@{/provider/activities/{id}/schedules(id=${activity.id})}" th:object="${schedule}"
                  method="post" class="row g-3" novalidate>

                <div class="col-md-6">
                    <label for="startDateTime" class="form-label">Fecha y hora de inicio</label>
                    <input type="datetime-local" id="startDateTime" class="form-control" th:field="*{startDateTime}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{startDateTime}"></div>
                </div>

                <div class="col-md-6">
                    <label for="capacity" class="form-label">Cupos</label>
                    <input type="number" min="1" id="capacity" class="form-control" th:field="*{capacity}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{capacity}"></div>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-success">Agregar horario</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Horarios cargados -->
    <div class="card">
        <div class="card-header fw-semibold">Horarios cargados</div>
        <div class="card-body" th:if="${#lists.isEmpty(schedules)}">
            <p class="text-muted mb-0">Todavía no agregaste horarios.</p>
        </div>
        <table class="table mb-0" th:unless="${#lists.isEmpty(schedules)}">
            <thead>
            <tr>
                <th>Fecha y hora</th>
                <th>Cupos</th>
                <th>Estado</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${schedules}">
                <td th:text="${#temporals.format(item.startDateTime, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${item.capacity}"></td>
                <td th:text="${item.status.name() == 'SCHEDULED'} ? 'Programado'
                             : (${item.status.name() == 'SUSPENDED'} ? 'Suspendido' : 'Finalizado')"></td>
            </tr>
            </tbody>
        </table>
    </div>

</main>
</body>
</html>
