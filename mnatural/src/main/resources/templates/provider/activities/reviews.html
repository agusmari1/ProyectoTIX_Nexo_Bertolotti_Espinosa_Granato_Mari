<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reseñas | Uruguay Mnatural</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header class="site-header">
    <div class="container">
        <a th:href="@{/}" class="brand"><span class="brand-mark"></span>Uruguay Mnatural</a>
    </div>
</header>

<!-- La foto se define en styles.css (.hero-actividades) -->
<section class="hero hero-compact hero-photo hero-actividades">
    <div class="container">
        <h1>Reseñas</h1>
        <p th:text="${activity.name}"></p>
    </div>
</section>

<main class="page page-flat container page-wide">

    <a th:href="@{/provider/activities/{id}/schedules(id=${activity.id})}" class="back-link">&larr; Fechas y horarios</a>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="alert alert-info" th:if="${#lists.isEmpty(reviews)}">
        Esta actividad todavía no tiene reseñas.
    </div>

    <!-- Las reseñas son públicas. Se pueden responder una vez, pero no editar ni eliminar -->
    <div class="card mb-3" th:each="review : ${reviews}">
        <div class="card-header d-flex flex-wrap justify-content-between gap-2">
            <span>
                <strong th:text="${review.authorName}"></strong>
                <span class="text-warning ms-1" th:attr="aria-label=${review.rating} + ' de 5'">
                    <th:block th:each="i : ${#numbers.sequence(1, 5)}" th:text="${i <= review.rating} ? '★' : '☆'"></th:block>
                </span>
            </span>
            <span class="small text-muted" th:text="${#temporals.format(review.createdAt, 'dd/MM/yyyy')}"></span>
        </div>
        <div class="card-body">
            <p style="white-space: pre-line" th:text="${review.comment}"></p>

            <div class="ms-3 ps-3 border-start small" th:if="${review.providerReply}">
                <span class="text-label">Tu respuesta</span>
                <span class="text-muted" th:text="' · ' + ${#temporals.format(review.repliedAt, 'dd/MM/yyyy')}"></span>
                <p class="mb-0" style="white-space: pre-line" th:text="${review.providerReply}"></p>
            </div>

            <form th:unless="${review.providerReply}"
                  th:action="@{/provider/activities/{id}/reviews/{reviewId}/reply(id=${activity.id}, reviewId=${review.id})}"
                  method="post">
                <label th:for="'reply-' + ${review.id}" class="form-label">Responder públicamente</label>
                <textarea th:id="'reply-' + ${review.id}" name="reply" class="form-control mb-2" rows="3"
                          maxlength="1000" required></textarea>
                <div class="form-text mb-2">Tu respuesta se muestra debajo del comentario y no se puede modificar después.</div>
                <button type="submit" class="btn btn-success btn-sm">Publicar respuesta</button>
            </form>
        </div>
    </div>

</main>

<footer class="site-footer">
    <div class="container">
        <a th:href="@{/}" class="brand"><span class="brand-mark"></span>Uruguay Mnatural</a>
        <span>Experiencias de naturaleza en todo Uruguay</span>
    </div>
</footer>

</body>
</html>
