<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Emprendimiento | Uruguay Mnatural</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header class="site-header">
    <div class="container">
        <a th:href="@{/}" class="brand"><span class="brand-mark"></span>Uruguay Mnatural</a>
        <nav th:replace="~{fragments/provider-nav :: nav}"></nav>
    </div>
</header>

<section class="hero hero-compact hero-photo hero-actividades">
    <div class="container">
        <h1 th:text="${editing} ? 'Editar emprendimiento' : 'Agregar emprendimiento'">Emprendimiento</h1>
        <p>Los datos de tu emprendimiento se muestran a los turistas en tus actividades.</p>
    </div>
</section>

<main class="page page-flat container page-wide">

    <a th:href="@{/provider/businesses}" class="back-link">← Volver a mis emprendimientos</a>

    <form th:action="@{${formAction}}" th:object="${business}" method="post" novalidate>

        <div class="card mb-4">
            <div class="card-header">Datos del emprendimiento</div>
            <div class="card-body row g-3">

                <div class="col-12">
                    <label for="name" class="form-label">Nombre del emprendimiento</label>
                    <input type="text" id="name" class="form-control" th:field="*{name}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>

                <div class="col-md-6">
                    <label for="legalType" class="form-label">Tipo</label>
                    <select id="legalType" class="form-select" th:field="*{legalType}" th:errorclass="is-invalid">
                        <option value="">Seleccioná…</option>
                        <option th:each="option : ${legalTypes}" th:value="${option.key}" th:text="${option.value}"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{legalType}"></div>
                </div>

                <div class="col-md-6">
                    <label for="rut" class="form-label">RUT <span class="text-muted fw-normal">(obligatorio para empresas)</span></label>
                    <input type="text" inputmode="numeric" id="rut" class="form-control" th:field="*{rut}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{rut}"></div>
                    <div class="form-text">12 dígitos, solo números.</div>
                </div>

                <div class="col-12">
                    <label for="address" class="form-label">Dirección</label>
                    <input type="text" id="address" class="form-control" th:field="*{address}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{address}"></div>
                </div>

                <div class="col-md-6">
                    <label for="phoneNumber" class="form-label">Teléfono del emprendimiento</label>
                    <input type="tel" id="phoneNumber" class="form-control" th:field="*{phoneNumber}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{phoneNumber}"></div>
                </div>

                <div class="col-md-6">
                    <label for="email" class="form-label">Correo del emprendimiento</label>
                    <input type="email" id="email" class="form-control" th:field="*{email}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>

                <div class="col-12">
                    <label for="servicesDescription" class="form-label">Descripción de los servicios <span class="text-muted fw-normal">(opcional)</span></label>
                    <textarea id="servicesDescription" rows="4" class="form-control" th:field="*{servicesDescription}" th:errorclass="is-invalid"></textarea>
                    <div class="invalid-feedback" th:errors="*{servicesDescription}"></div>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-success btn-lg w-100"
                th:text="${editing} ? 'Guardar cambios' : 'Agregar emprendimiento'">Guardar</button>
    </form>

</main>

<footer class="site-footer">
    <div class="container">
        <a th:href="@{/}" class="brand"><span class="brand-mark"></span>Uruguay Mnatural</a>
        <span>Experiencias de naturaleza en todo Uruguay</span>
    </div>
</footer>

</body>
</html>
