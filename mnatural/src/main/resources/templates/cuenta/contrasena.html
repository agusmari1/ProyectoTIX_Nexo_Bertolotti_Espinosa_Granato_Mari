<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cambiar contraseña | Uruguay Mnatural</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<section class="hero hero-compact hero-photo hero-actividades">
    <div class="container">
        <h1>Cambiar contraseña</h1>
        <p>Elegí una contraseña nueva para tu cuenta.</p>
    </div>
</section>

<main class="page page-flat container page-wide">

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <form th:action="@{/cuenta/contrasena}" th:object="${passwordChange}" method="post" novalidate>
        <div class="card mb-4">
            <div class="card-header">Contraseña</div>
            <div class="card-body row g-3">

                <div class="col-12">
                    <label for="currentPassword" class="form-label">Contraseña actual</label>
                    <input type="password" id="currentPassword" class="form-control" autocomplete="current-password"
                           th:field="*{currentPassword}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{currentPassword}"></div>
                </div>

                <div class="col-md-6">
                    <label for="newPassword" class="form-label">Contraseña nueva</label>
                    <input type="password" id="newPassword" class="form-control" autocomplete="new-password"
                           th:field="*{newPassword}" th:errorclass="is-invalid">
                    <!-- Solo el primer error: vacía dispara @NotBlank y @Size a la vez -->
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}"
                         th:text="${#fields.errors('newPassword')[0]}"></div>
                    <div class="form-text">Mínimo 8 caracteres.</div>
                </div>

                <div class="col-md-6">
                    <label for="confirmPassword" class="form-label">Repetir contraseña nueva</label>
                    <input type="password" id="confirmPassword" class="form-control" autocomplete="new-password"
                           th:field="*{confirmPassword}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-success btn-lg w-100">Cambiar contraseña</button>
    </form>

</main>

<footer class="site-footer">
    <div class="container">
        <a th:href="@{/}" class="brand"><span class="brand-mark"></span>Uruguay Mnatural</a>
        <span>Experiencias de naturaleza en todo Uruguay</span>
    </div>
</footer>

</body>
</html>
