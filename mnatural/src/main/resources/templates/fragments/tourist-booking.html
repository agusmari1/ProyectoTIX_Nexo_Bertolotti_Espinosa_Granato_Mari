<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Una reserva. Se usa en las dos secciones -->
<th:block th:fragment="card(booking)">
    <div class="card item-card" th:attr="data-booking-id=${booking.bookingId}"
         th:with="reviewed=${reviewedIds != null and reviewedIds.contains(booking.bookingId)}">
        <div class="card-header">
            <span th:text="${booking.activityName}"></span>
            <span th:switch="${booking.status.name()}">
                <span th:case="'CONFIRMED'" class="badge text-bg-success" th:text="#{status.CONFIRMED}">Confirmada</span>
                <span th:case="'PENDING'" class="badge text-bg-warning" th:text="#{status.PENDING}">Pendiente de pago</span>
                <span th:case="'CANCELLED'" class="badge text-bg-secondary" th:text="#{status.CANCELLED}">Cancelada</span>
                <span th:case="'EXPIRED'" class="badge text-bg-secondary" th:text="#{status.EXPIRED}">Vencida</span>
            </span>
            <span class="badge text-bg-light border" th:if="${reviewed}" th:text="#{myBookings.reviewed}">Valorada</span>
        </div>
        <div class="card-body">
            <div class="row g-2 small">
                <div class="col-md-6">
                    <span class="text-label" th:text="#{myBookings.date}">Fecha:</span>
                    <span th:text="${#temporals.format(booking.startDateTime, 'dd/MM/yyyy')}"></span>
                </div>
                <div class="col-md-6">
                    <span class="text-label" th:text="#{myBookings.time}">Horario:</span>
                    <span th:text="${#temporals.format(booking.startDateTime, 'HH:mm')}"></span>
                </div>
                <div class="col-md-6">
                    <span class="text-label" th:text="#{myBookings.participants}">Participantes:</span>
                    <span th:text="${booking.participantCount}"></span>
                </div>
                <div class="col-md-6">
                    <span class="text-label" th:text="#{myBookings.total}">Total:</span>
                    $ <span th:text="${#numbers.formatDecimal(booking.totalAmount, 1, 'DEFAULT', 2, 'DEFAULT')}"></span>
                </div>
                <div class="col-12" th:if="${booking.status.name() == 'PENDING' and booking.heldUntil != null}">
                    <span class="text-label" th:text="#{myBookings.payBefore}">Pagá antes de las:</span>
                    <strong th:text="${#temporals.format(booking.heldUntil, 'HH:mm')}"></strong>
                    <span th:text="#{myBookings.on}">del</span> <span th:text="${#temporals.format(booking.heldUntil, 'dd/MM/yyyy')}"></span>
                </div>
                <div class="col-12" th:if="${booking.bookingCode}">
                    <span class="text-label" th:text="#{myBookings.code}">Código de reserva:</span>
                    <strong th:text="${booking.bookingCode}"></strong>
                </div>
            </div>
        </div>
        <div class="card-footer d-flex flex-wrap gap-2">
            <a th:href="@{/payments/bookings/{id}(id=${booking.bookingId})}" class="btn btn-outline-success btn-sm"
               th:text="${booking.status.name() == 'PENDING'} ? #{myBookings.viewAndPay} : #{myBookings.viewDetail}"></a>
            <!--/* Se ofrece valorar solo si está confirmada, ya terminó y todavía no tiene reseña (ReviewService vuelve a exigirlo al enviar) */-->
            <a th:if="${booking.reviewable and !reviewed}" th:href="@{/reviews/bookings/{id}(id=${booking.bookingId})}"
               class="btn btn-success btn-sm rate-button" th:text="#{myBookings.rate}">Valorar</a>
            <a th:if="${reviewed}" th:href="@{/reviews/bookings/{id}(id=${booking.bookingId})}"
               class="btn btn-outline-secondary btn-sm" th:text="#{myBookings.viewReview}">Ver mi reseña</a>
        </div>
    </div>
</th:block>


</body>
</html>
