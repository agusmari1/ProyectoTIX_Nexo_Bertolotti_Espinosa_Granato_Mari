<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!--/*
    Pronóstico del tiempo para el detalle de una actividad. Se incluye con UNA línea:
    <div th:replace="~{fragments/weather :: forecast(${activity.department}, ${schedules.![schedule.startDateTime]})}"></div>
    Si no hay pronóstico (servicio caído, fechas fuera de rango) no se muestra nada: WeatherService nunca lanza errores.
    La descripción llega en español desde WeatherService: se traduce con la clave weather.desc.<descripcion_en_minusculas>
    y, si esa clave no existe, se muestra tal como llegó
*/-->
<th:block th:fragment="forecast(department, startTimes)">
    <th:block th:with="days=${weather?.forecastsFor(department, startTimes)}">
        <div class="card mb-4" th:if="${!#lists.isEmpty(days)}">
            <div class="card-header" th:text="#{weather.title}">Pronóstico del tiempo</div>
            <div class="card-body">
                <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 py-2 border-bottom"
                     th:each="day : ${days}">
                    <strong th:text="${#temporals.format(day.date(), 'dd/MM/yyyy')}">15/01/2027</strong>
                    <span th:if="${day.description() != null}"
                          th:text="${#messages.msgOrNull('weather.desc.' + #strings.replace(#strings.toLowerCase(day.description()), ' ', '_'))} ?: ${day.description()}">Despejado</span>
                    <span class="text-muted small"
                          th:text="${day.minTemperature()} + '° / ' + ${day.maxTemperature()} + '°'">18° / 28°</span>
                    <span class="text-muted small" th:if="${day.rainProbability() != null}"
                          th:text="#{weather.rain(${day.rainProbability()})}">Lluvia: 20 %</span>
                </div>
                <div class="small text-muted mt-2">
                    <span th:text="#{weather.source}">Pronóstico para la capital del departamento. Datos de</span>
                    <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a>.
                </div>
            </div>
        </div>
    </th:block>
</th:block>

</body>
</html>
