<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro de turista | Uruguay Mnatural</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header class="site-header">
    <div class="container">
        <a th:href="@{/}" class="brand"><span class="brand-mark"></span>Uruguay Mnatural</a>
        <nav class="site-nav">
            <a th:href="@{/login}">Iniciar sesión</a>
        </nav>
    </div>
</header>

<!-- La foto se define en styles.css (.hero-registro) -->
<section class="hero hero-photo hero-registro">
    <div class="container">
        <h1>Registro de turista</h1>
        <p>Creá tu cuenta para reservar actividades en todo el país.</p>
    </div>
</section>

<main class="page container page-wide">

    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form th:action="@{/registro/turista}" th:object="${registration}" method="post" novalidate>

        <!-- Datos personales -->
        <div class="card mb-4">
            <div class="card-header">Datos personales</div>
            <div class="card-body row g-3">

                <div class="col-md-6">
                    <label for="name" class="form-label">Nombre</label>
                    <input type="text" id="name" class="form-control" th:field="*{name}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>

                <div class="col-md-6">
                    <label for="lastName" class="form-label">Apellido</label>
                    <input type="text" id="lastName" class="form-control" th:field="*{lastName}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{lastName}"></div>
                </div>

                <div class="col-md-6">
                    <label for="dateOfBirth" class="form-label">Fecha de nacimiento</label>
                    <input type="date" id="dateOfBirth" class="form-control" th:field="*{dateOfBirth}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{dateOfBirth}"></div>
                </div>

                <div class="col-md-6">
                    <label for="country" class="form-label">País de residencia</label>
                    <input type="text" id="country" class="form-control" th:field="*{country}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{country}"></div>
                </div>

                <div class="col-md-6">
                    <label for="documentType" class="form-label">Tipo de documento</label>
                    <select id="documentType" class="form-select" th:field="*{documentType}" th:errorclass="is-invalid">
                        <option value="">Seleccioná…</option>
                        <option th:each="option : ${documentTypes}" th:value="${option.key}" th:text="${option.value}"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{documentType}"></div>
                </div>

                <div class="col-md-6">
                    <label for="documentNumber" class="form-label">Número de documento</label>
                    <input type="text" id="documentNumber" class="form-control" th:field="*{documentNumber}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{documentNumber}"></div>
                </div>

                <div class="col-md-6">
                    <label for="phoneNumber" class="form-label">Teléfono <span class="text-muted fw-normal">(opcional)</span></label>
                    <input type="tel" id="phoneNumber" class="form-control" th:field="*{phoneNumber}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{phoneNumber}"></div>
                </div>
            </div>
        </div>

        <!-- Credenciales -->
        <div class="card mb-4">
            <div class="card-header">Datos de acceso</div>
            <div class="card-body row g-3">

                <div class="col-md-6">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input type="email" id="email" class="form-control" th:field="*{email}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>

                <div class="col-md-6">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" class="form-control" th:field="*{password}" th:errorclass="is-invalid">
                    <!-- Solo el primer error: vacía dispara @NotBlank y @Size a la vez -->
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                         th:text="${#fields.errors('password')[0]}"></div>
                    <div class="form-text">Mínimo 8 caracteres.</div>
                </div>

                <div class="col-md-6 offset-md-6">
                    <label for="confirmPassword" class="form-label">Repetir contraseña</label>
                    <input type="password" id="confirmPassword" class="form-control" th:field="*{confirmPassword}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-success btn-lg w-100">Crear cuenta</button>

        <p class="text-center text-muted mt-4 mb-0">
            ¿Ya tenés cuenta? <a th:href="@{/login}">Iniciá sesión</a>
        </p>
    </form>

</main>

<footer class="site-footer">
    <div class="container">
        <a th:href="@{/}" class="brand"><span class="brand-mark"></span>Uruguay Mnatural</a>
        <span>Experiencias de naturaleza en todo Uruguay</span>
    </div>
</footer>

</body>
</html>
