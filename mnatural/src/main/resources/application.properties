spring.application.name=mnatural

spring.datasource.url=jdbc:postgresql://localhost:5432/mNatural
spring.datasource.username=postgres
spring.datasource.password=contrasenanexo

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Correo. Todo se define con variables de entorno; en el repo no hay ninguna cuenta ni contraseña.
# Con app.mail.enabled=false (por defecto) no se envía nada: los mensajes se imprimen en el log.
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Sin estos tiempos, un servidor de correo caído dejaría colgada la pantalla del admin
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Dirección pública de la app, para los links que van en los correos
app.base-url=${APP_BASE_URL:http://localhost:8080}