spring.application.name=mnatural

spring.datasource.url=jdbc:postgresql://localhost:5432/mNatural
spring.datasource.username=postgres
spring.datasource.password=contrasenanexo

spring.jpa.hibernate.ddl-auto=update
# Las consultas SQL traen datos personales: solo se imprimen si se pide con SHOW_SQL=true
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Correo. Todo se define con variables de entorno; en el repo no hay ninguna cuenta ni contraseña.
# Con app.mail.enabled=false (por defecto) no se envía nada: los mensajes se imprimen en el log.
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
# Remitente de todos los correos: MAIL_FROM si se define; si no, MAIL_USERNAME (un servidor real suele exigir que el
# remitente sea la cuenta con la que se inicia sesión); y si tampoco, una dirección por defecto
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@mnatural.uy}}
spring.mail.properties.mail.from=${app.mail.from}
# Un servidor real (Gmail, etc.) pide usuario/contraseña y cifrado: son los valores por defecto. Mailpit no usa ninguno de
# los dos: con MAIL_SMTP_AUTH=false y MAIL_STARTTLS=false se puede conectar sin credenciales
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
# Sin estos tiempos, un servidor de correo caído dejaría colgada la pantalla del admin
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Dirección pública de la app, para los links que van en los correos
app.base-url=${APP_BASE_URL:http://localhost:8080}